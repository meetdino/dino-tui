name: Release

# A v* tag (matching Cargo.toml's version) builds dino-tui for macOS on Apple silicon and Linux on
# x86_64 and arm64, and puts the tarballs and their SHA-256 sums on the tag's GitHub release.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
      # dino-core links the system SQLite (rusqlite), though dino-tui never uses it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev
      - run: rustup toolchain install --no-self-update
      - run: cargo build --release --locked
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="dino-tui-${GITHUB_REF_NAME#v}-$TARGET"
          mkdir "$name"
          cp target/release/dino-tui LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          ./"$name"/dino-tui --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dino-tui-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dino-tui-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "dino-tui ${GITHUB_REF_NAME#v}" \
            --notes "dino-tui ${GITHUB_REF_NAME#v} for macOS (Apple silicon) and Linux (x86_64, arm64). It talks to dinod from dino 0.1.11 or later." \
            dino-tui-*.tar.gz SHA256SUMS
